name: Escáner OCR APK

# Compila apps/escaner-ocr como APK Android (Capacitor) y lo publica en la release "escaner-apk"
on:
  push:
    branches: [main]
    paths: ["apps/escaner-ocr/**", ".github/workflows/escaner-apk.yml"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: escaner-apk
  cancel-in-progress: true

jobs:
  apk:
    name: Compilar APK
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/escaner-ocr/apk
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      # Misma clave de firma entre compilaciones: así el APK nuevo se instala encima del anterior
      - name: Clave de firma debug persistente
        uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: escaner-debug-keystore

      - name: Librerías sin internet (vendor)
        run: node ../descargar-libs.js

      - name: Capacitor
        run: |
          npm install --no-audit --no-fund
          npx cap add android
          # Cámara para getUserMedia; versionCode creciente para poder actualizar
          sed -i 's|<uses-permission android:name="android.permission.INTERNET" />|&\n    <uses-permission android:name="android.permission.CAMERA" />\n    <uses-feature android:name="android.hardware.camera" android:required="false" />|' android/app/src/main/AndroidManifest.xml
          sed -i "s/versionCode 1$/versionCode ${{ github.run_number }}/; s/versionName \"1.0\"/versionName \"1.${{ github.run_number }}\"/" android/app/build.gradle
          grep -q CAMERA android/app/src/main/AndroidManifest.xml
          npx cap sync android

      - name: Gradle assembleDebug
        run: cd android && ./gradlew assembleDebug --no-daemon -q

      - name: Publicar release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp android/app/build/outputs/apk/debug/app-debug.apk escaner-ocr.apk
          gh release delete escaner-apk --yes --cleanup-tag || true
          gh release create escaner-apk escaner-ocr.apk --target "$GITHUB_SHA" --prerelease \
            --title "Escáner OCR APK (build ${{ github.run_number }})" \
            --notes "APK de prueba (firma debug) compilado desde ${GITHUB_SHA::7}. Descargar en el celular e instalar (permitir orígenes desconocidos)."
