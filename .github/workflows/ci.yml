name: UCN CI

on:
  push:
    branches: [main, master, "mejoras-*"]
  pull_request:
    branches: [main, master]

jobs:
  checks:
    name: UCN checks (go build, bash, tests, docs)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: ucn/go.mod
          cache: false

      - name: Go fmt check
        run: |
          cd ucn
          gofmt -l . | tee /tmp/gofmt.txt
          if [ -s /tmp/gofmt.txt ]; then
            echo "❌ Archivos Go sin formato:"
            cat /tmp/gofmt.txt
            exit 1
          fi
          echo "✓ gofmt limpio"

      - name: Go vet
        run: cd ucn && go vet ./...

      - name: Go build
        run: cd ucn && go build -o /tmp/ucn-bin ./cmd/ucn/ && /tmp/ucn-bin help | grep -q "agent" && echo "✓ binario responde"

      - name: Go test
        run: cd ucn && go test ./...

      - name: Bash syntax check
        run: |
          set -e
          for f in $(find . -name "*.sh" -not -path "./.git/*"); do
            bash -n "$f" && echo "✓ bash -n $f"
          done

      - name: ShellCheck (si disponible via apt)
        run: |
          if command -v shellcheck >/dev/null 2>&1; then
            find . -name "*.sh" -not -path "./.git/*" -print0 | xargs -0 shellcheck -e SC1090,SC1091,SC2155
          else
            echo "shellcheck no instalado, se omite (sintaxis ya validada)"
          fi

      - name: Test suite (usa un HOME temporal)
        run: ./scripts/test-all.sh all

      - name: Documentation structure check
        run: |
          missing=0
          for f in config/agents.yaml config/config.yaml.example config/.env.example scripts/ucn-platform.sh scripts/test-all.sh termux-bash/termux-bash.sh ucn/internal/bootstrap/bootstrap.go ucn/internal/profile/profile.go ucn/cmd/ucn/main.go profiles/default/profile.yaml profiles/ingenieria/profile.yaml README.md; do
            if [ -e "$f" ]; then
              echo "✓ $f"
            else
              echo "❌ falta $f"
              missing=1
            fi
          done
          exit "$missing"

  python:
    name: Super Organizador (pytest)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: super_organizador/requirements.txt

      - name: Instalar dependencias
        run: pip install -r super_organizador/requirements.txt pytest

      - name: pytest
        run: cd super_organizador && python -m pytest -q

  windows-syntax:
    name: Windows scripts syntax (pwsh + cmd lint)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: PowerShell scripts parse (pwsh)
        shell: bash
        run: |
          set -e
          pwsh -NoProfile -Command '
            $failed = $false
            $files = Get-ChildItem -Recurse -Filter *.ps1 | Where-Object { $_.FullName -notmatch "agent-skills" }
            foreach ($file in $files) {
              $tokens = $null
              $errors = $null
              [System.Management.Automation.Language.Parser]::ParseFile($file.FullName, [ref]$tokens, [ref]$errors) | Out-Null
              if ($errors.Count -gt 0) {
                $failed = $true
                $errors | ForEach-Object { Write-Host ("{0} linea {1}: {2}" -f $file.Name, $_.Extent.StartLineNumber, $_.Message) }
              } else {
                Write-Host ("✓ {0}" -f $file.Name)
              }
            }
            if ($failed) { exit 1 }
          '

      - name: CMD doskey lint
        run: |
          set -e
          bad=0
          while IFS= read -r line; do
            line=$(echo "$line" | sed 's/^[ \t]*//')
            case "$line" in
              doskey*)
                if ! echo "$line" | grep -qE '^doskey [a-zA-Z0-9_${}.-]+='; then
                  echo "❌ doskey mal formado: $line"
                  bad=1
                fi
                ;;
            esac
          done < laptop-cmd/ucn.cmd
          if [ "$bad" -ne 0 ]; then exit 1; fi
          echo "✓ ucn.cmd: todas las lineas doskey con formato valido"

      - name: ucn bootstrap --dry run output
        run: |
          set -e
          cd ucn && go build -o /tmp/ucn-bin ./cmd/ucn/
          cd "$GITHUB_WORKSPACE" && /tmp/ucn-bin bootstrap 2>&1 | grep -q "Dispositivo configurado"
          echo "✓ ucn bootstrap responde"

      - name: ucn update --check
        run: |
          set -e
          cd ucn && go build -o /tmp/ucn-bin ./cmd/ucn/
          cd "$GITHUB_WORKSPACE" && /tmp/ucn-bin update --check 2>&1 | grep -q "UCN UPDATE"
          echo "✓ ucn update --check responde"

  windows:
    name: Windows real (go test + perfil PowerShell)
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: ucn/go.mod
          cache: false

      - name: Go test
        run: cd ucn; go test ./...

      - name: Go build y ayuda
        run: cd ucn; go build -o ucn.exe ./cmd/ucn/; ./ucn.exe help

      - name: Cargar perfil PowerShell
        shell: pwsh
        run: |
          $ErrorActionPreference = "Continue"
          try {
            . ./laptop-powershell/Microsoft.PowerShell_profile.ps1
          } catch {
            Write-Host "::error::Perfil: $($_.Exception.Message) en $($_.InvocationInfo.PositionMessage)"
            exit 1
          }
          foreach ($cmd in "Invoke-UcnAgent", "Show-MOTD", "ucn-agents") {
            if (-not (Get-Command $cmd -ErrorAction SilentlyContinue)) {
              Write-Host "::error::Perfil: falta el comando $cmd"
              exit 1
            }
          }
          Write-Host "✓ Perfil cargado"
          exit 0