# ==============================================================================
# UCN TERMINAL UI - FUENTE UNICA DE PERSONALIZACION
# ==============================================================================
# Este archivo alimenta el MOTD de:
#   - termux-bash/motd.sh                                  (Termux / Ubuntu proot / Linux / macOS)
#   - laptop-powershell/Microsoft.PowerShell_profile.ps1   (Windows PowerShell)
#   - laptop-cmd/ucn.cmd                                   (Windows CMD)
#
# Formato: tipo|campo1|campo2|campo3|campo4
#   - Las lineas vacias y las que empiezan con # se ignoran.
#   - No uses "|" dentro de los textos.
#   - El orden de las lineas es el orden en pantalla.
#
# Tipos:
#   label|clave|texto              textos fijos (title, welcome)
#   section|clave|titulo           cabecera de seccion
#   command|nombre|descripcion     comandos rapidos
#   agent|nombre|binario|normal|full
#   nav|nombre|descripcion         accesos de productividad
#
# Si agregas un agente, actualiza tambien config/agents.yaml:
# ./scripts/test-all.sh quick verifica que las dos listas coincidan.
# ==============================================================================

